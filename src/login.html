<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sign In — ShopFlow</title>
  <link rel="stylesheet" href="./styles/main.scss">
</head>
<body class="auth-page">

  <div class="auth-card neu-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="logo-icon"><i class="bi bi-bag-heart-fill"></i></div>
      <h1>ShopFlow</h1>
      <p>Welcome back! Sign in to your account.</p>
    </div>

    <!-- Error alert -->
    <div class="auth-error" id="auth-error"></div>

    <!-- Form -->
    <form id="login-form" novalidate>
      <div class="auth-form-group">
        <label class="auth-label" for="email">Email address</label>
        <input type="email" id="email" class="neu-input" placeholder="you@company.com" autocomplete="username" required>
      </div>
      <div class="auth-form-group">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="auth-label mb-0" for="password">Password</label>
          <a href="#" style="font-size:0.82rem;color:var(--sf-primary);text-decoration:none">Forgot password?</a>
        </div>
        <div style="position:relative">
          <input type="password" id="password" class="neu-input" placeholder="Enter your password" autocomplete="current-password" required style="padding-right:48px">
          <button type="button" id="toggle-pw" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--neu-text-light);cursor:pointer;font-size:1rem">
            <i class="bi bi-eye" id="pw-icon"></i>
          </button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:24px">
        <input type="checkbox" id="remember" style="width:16px;height:16px;accent-color:var(--sf-primary)">
        <label for="remember" style="font-size:0.85rem;color:var(--neu-text-light);cursor:pointer">Keep me signed in for 30 days</label>
      </div>
      <button type="submit" id="submit-btn" class="neu-btn neu-btn-primary w-100 d-flex align-items-center justify-content-center gap-2" style="font-size:0.95rem">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Sign In</span>
      </button>
    </form>

    <!-- Demo hint -->
    <div style="margin-top:20px;background:rgba(79,110,247,0.07);border-radius:12px;padding:14px 16px;border:1px solid rgba(79,110,247,0.15)">
      <div style="font-size:0.78rem;font-weight:700;color:var(--sf-primary);margin-bottom:6px">
        <i class="bi bi-info-circle me-1"></i> Demo Credentials
      </div>
      <div style="font-size:0.8rem;color:var(--neu-text-light)">
        <strong>Admin:</strong> admin@shopflow.com / admin123
      </div>
      <div style="font-size:0.78rem;color:var(--neu-text-light);margin-top:3px">Register a new account for customer access</div>
    </div>

    <div class="auth-divider" style="margin:20px 0">or</div>
    <p style="text-align:center;font-size:0.88rem;color:var(--neu-text-light);margin:0">
      Don't have an account? 
      <a href="./register.html" style="color:var(--sf-primary);font-weight:700;text-decoration:none">Create Account</a>
    </p>
    <p style="text-align:center;margin-top:12px">
      <a href="./landing.html" style="font-size:0.82rem;color:var(--neu-text-light);text-decoration:none">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </p>
  </div>

<script type="module">
  import { AuthStore } from './scripts/store.js';

  // Already logged in?
  if (AuthStore.currentUser()) {
    window.location.href = './dashboard/index.html';
  }

  // Password toggle
  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      pw.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });

  // Form submit
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submit-btn');
    const errDiv = document.getElementById('auth-error');

    errDiv.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner-border spinner-border-sm me-2" role="status"></div> Signing in…';

    await new Promise(r => setTimeout(r, 600)); // simulate request

    const result = AuthStore.login(email, password);
    if (result.error) {
      errDiv.textContent = result.error;
      errDiv.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i><span>Sign In</span>';
    } else {
      btn.innerHTML = '<i class="bi bi-check-circle-fill"></i><span>Success! Redirecting…</span>';
      const params = new URLSearchParams(window.location.search);
      const returnUrl = params.get('return') || './dashboard/index.html';
      setTimeout(() => window.location.href = returnUrl, 600);
    }
  });
</script>
</body>
</html>
