<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders – ShopFlow</title>
  <link rel="stylesheet" href="../styles/main.scss" />
  <style>
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:1.5rem; }
    .stat-card  { background:#fff; border-radius:12px; padding:1.25rem 1.5rem; box-shadow:0 1px 4px rgba(0,0,0,.07); display:flex; flex-direction:column; gap:.25rem; }
    .stat-card__value { font-size:1.75rem; font-weight:700; color:#1e293b; }
    .stat-card__label { font-size:.8rem; color:#64748b; text-transform:uppercase; letter-spacing:.05em; }

    .toolbar { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; }
    .toolbar input[type=search] { padding:.5rem .75rem; border:1px solid #e2e8f0; border-radius:8px; font-size:.875rem; background:#fff; flex:1; min-width:180px; }

    .filter-tabs { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
    .filter-tab { padding:.35rem .9rem; border:1px solid #e2e8f0; border-radius:999px; font-size:.8rem; font-weight:600; cursor:pointer; background:#fff; color:#475569; transition:all .15s; }
    .filter-tab.active { background:#2563eb; color:#fff; border-color:#2563eb; }

    .data-table-wrap { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:.875rem; }
    th { padding:.75rem 1rem; text-align:left; background:#f8fafc; color:#64748b; font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid #e2e8f0; white-space:nowrap; }
    td { padding:.75rem 1rem; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#fafbfc; }

    .badge { display:inline-flex; align-items:center; padding:.2rem .65rem; border-radius:999px; font-size:.72rem; font-weight:600; }
    .order-id { font-family:monospace; font-size:.82rem; color:#475569; }
    .btn-icon  { background:none; border:none; cursor:pointer; padding:.35rem .6rem; border-radius:6px; color:#64748b; font-size:.85rem; font-weight:600; transition:background .15s; }
    .btn-icon:hover { background:#f1f5f9; color:#1e293b; }

    .status-select { padding:.3rem .6rem; border:1px solid #e2e8f0; border-radius:8px; font-size:.8rem; font-weight:600; cursor:pointer; background:#fff; }

    /* Modal */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .modal-backdrop.hidden { display:none; }
    .modal { background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); display:flex; flex-direction:column; }
    .modal-header { padding:1.25rem 1.5rem; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:#fff; z-index:1; }
    .modal-header h2 { font-size:1.1rem; font-weight:700; color:#1e293b; }
    .modal-close { background:none; border:none; font-size:1.4rem; cursor:pointer; color:#94a3b8; }
    .modal-close:hover { color:#dc2626; }
    .modal-body  { padding:1.5rem; display:flex; flex-direction:column; gap:1rem; }
    .modal-footer { padding:1rem 1.5rem; border-top:1px solid #e2e8f0; display:flex; justify-content:flex-end; gap:.75rem; }
    .btn { padding:.55rem 1.25rem; border:none; border-radius:8px; font-weight:600; font-size:.875rem; cursor:pointer; }
    .btn-secondary { background:#f1f5f9; color:#374151; }
    .btn-secondary:hover { background:#e2e8f0; }

    .order-items-list { display:flex; flex-direction:column; gap:.75rem; }
    .order-item { display:flex; align-items:center; gap:.75rem; padding:.75rem; background:#f8fafc; border-radius:10px; }
    .order-item img { width:48px; height:48px; border-radius:8px; object-fit:cover; background:#e2e8f0; }
    .order-item__info { flex:1; }
    .order-item__name { font-weight:600; font-size:.875rem; color:#1e293b; }
    .order-item__qty  { font-size:.75rem; color:#64748b; }
    .order-item__price { font-weight:700; color:#2563eb; font-size:.9rem; }

    .info-row { display:flex; justify-content:space-between; align-items:center; }
    .info-row span:first-child { font-size:.85rem; color:#64748b; }
    .info-row span:last-child  { font-weight:600; font-size:.875rem; color:#1e293b; }
    .divider { border:none; border-top:1px solid #e2e8f0; }
    .total-row span { font-weight:700; font-size:1rem; }

    .empty-state { text-align:center; padding:3rem 1rem; color:#94a3b8; }
    .empty-state p { font-size:1rem; }

    .timeline { display:flex; flex-direction:column; gap:.5rem; padding:.5rem 0; }
    .timeline-step { display:flex; align-items:center; gap:.75rem; font-size:.82rem; }
    .timeline-dot  { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .timeline-dot.done { background:#16a34a; }
    .timeline-dot.current { background:#2563eb; box-shadow:0 0 0 3px #bfdbfe; }
    .timeline-dot.pending { background:#e2e8f0; }
  </style>
</head>
<body>
<div class="admin-app">
  <div class="admin-header" id="admin-header-placeholder"></div>
  <main class="admin-main">

    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:1.5rem;">
      <div>
        <h1 style="font-size:1.5rem;font-weight:700;color:#1e293b;margin:0">Orders</h1>
        <p style="color:#64748b;font-size:.875rem;margin:.25rem 0 0" id="orders-subtitle">Manage customer orders</p>
      </div>
    </div>

    <!-- Stats (admin only) -->
    <div class="stats-grid" id="admin-stats" style="display:none;"></div>

    <!-- Filter tabs -->
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-status="">All</button>
      <button class="filter-tab" data-status="confirmed">Confirmed</button>
      <button class="filter-tab" data-status="processing">Processing</button>
      <button class="filter-tab" data-status="shipped">Shipped</button>
      <button class="filter-tab" data-status="delivered">Delivered</button>
      <button class="filter-tab" data-status="cancelled">Cancelled</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="search" id="order-search" placeholder="🔍  Search by Order ID…" />
    </div>

    <!-- Table -->
    <div class="data-table-wrap">
      <table>
        <thead>
          <tr id="table-head-row"></tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- ─────────── ORDER DETAIL MODAL ─────────── -->
<div class="modal-backdrop hidden" id="order-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="order-modal-title">Order Details</h2>
      <button class="modal-close" id="order-modal-close">✕</button>
    </div>
    <div class="modal-body" id="order-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="order-modal-ok">Close</button>
    </div>
  </div>
</div>

<script type="module">
  import { initDashboardShell, formatINR, formatDate, getStatusColor, getStatusBg, showToast } from '../scripts/dashboard-shell.js';
  import { OrderStore, UserStore, AuthStore, ProductStore } from '../scripts/store.js';

  initDashboardShell({ activePage: 'orders', pageTitle: 'Orders' });

  const $ = id => document.getElementById(id);

  const user    = AuthStore.current();
  const isAdmin = user?.role === 'admin';

  /* ── Status helpers ── */
  const STATUS_FLOW = ['confirmed', 'processing', 'shipped', 'delivered'];

  function statusBadge(status) {
    const colors = {
      confirmed:  { bg:'#dbeafe', color:'#1d4ed8' },
      processing: { bg:'#fef3c7', color:'#d97706' },
      shipped:    { bg:'#ede9fe', color:'#7c3aed' },
      delivered:  { bg:'#dcfce7', color:'#16a34a' },
      cancelled:  { bg:'#fee2e2', color:'#dc2626' },
    };
    const c = colors[status] || { bg:'#f1f5f9', color:'#475569' };
    return `<span class="badge" style="background:${c.bg};color:${c.color}">${status.charAt(0).toUpperCase()+status.slice(1)}</span>`;
  }

  function nextStatuses(current) {
    if (current === 'cancelled' || current === 'delivered') return [];
    const idx = STATUS_FLOW.indexOf(current);
    const nexts = idx >= 0 && idx < STATUS_FLOW.length - 1 ? [STATUS_FLOW[idx + 1]] : [];
    nexts.push('cancelled');
    return nexts;
  }

  /* ── Stats (admin) ── */
  function renderAdminStats(orders) {
    const total     = orders.length;
    const revenue   = orders.filter(o => o.status === 'delivered').reduce((s,o) => s + (o.total || 0), 0);
    const pending   = orders.filter(o => ['confirmed','processing'].includes(o.status)).length;
    const delivered = orders.filter(o => o.status === 'delivered').length;
    $('admin-stats').innerHTML = `
      <div class="stat-card"><span class="stat-card__value">${total}</span><span class="stat-card__label">Total Orders</span></div>
      <div class="stat-card"><span class="stat-card__value">${formatINR(revenue)}</span><span class="stat-card__label">Total Revenue</span></div>
      <div class="stat-card"><span class="stat-card__value">${pending}</span><span class="stat-card__label">Pending</span></div>
      <div class="stat-card"><span class="stat-card__value">${delivered}</span><span class="stat-card__label">Delivered</span></div>
    `;
  }

  /* ── Table head ── */
  function buildTableHead() {
    const cols = isAdmin
      ? ['Order ID', 'Customer', 'Items', 'Total', 'Payment', 'Status', 'Date', 'Actions']
      : ['Order ID', 'Items', 'Total', 'Payment', 'Status', 'Date', 'Details'];
    $('table-head-row').innerHTML = cols.map(c => `<th>${c}</th>`).join('');
  }

  /* ── Render table ── */
  function renderOrders(orders) {
    const tbody = $('orders-tbody');
    if (!orders.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><p>No orders found.</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = orders.map(o => {
      const customer = isAdmin ? (UserStore.getById(o.userId)?.name || 'Unknown') : null;
      const nexts    = isAdmin ? nextStatuses(o.status) : [];
      const statusDropdown = isAdmin && nexts.length
        ? `<select class="status-select" onchange="changeStatus('${o.id}',this.value)">
             <option value="">${o.status.charAt(0).toUpperCase()+o.status.slice(1)}</option>
             ${nexts.map(s => `<option value="${s}">${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
           </select>`
        : statusBadge(o.status);

      if (isAdmin) {
        return `
          <tr>
            <td class="order-id">#${o.id}</td>
            <td>${customer}</td>
            <td style="font-weight:600">${(o.items||[]).length}</td>
            <td style="font-weight:700;color:#1e293b">${formatINR(o.total)}</td>
            <td style="color:#475569">${o.paymentMethod || 'COD'}</td>
            <td>${statusDropdown}</td>
            <td style="color:#64748b;font-size:.8rem">${formatDate(o.createdAt)}</td>
            <td><button class="btn-icon" onclick="viewOrder('${o.id}')">👁 View</button></td>
          </tr>`;
      } else {
        return `
          <tr>
            <td class="order-id">#${o.id}</td>
            <td style="font-weight:600">${(o.items||[]).length}</td>
            <td style="font-weight:700;color:#1e293b">${formatINR(o.total)}</td>
            <td style="color:#475569">${o.paymentMethod || 'COD'}</td>
            <td>${statusBadge(o.status)}</td>
            <td style="color:#64748b;font-size:.8rem">${formatDate(o.createdAt)}</td>
            <td><button class="btn-icon" onclick="viewOrder('${o.id}')">👁 Details</button></td>
          </tr>`;
      }
    }).join('');
  }

  /* ── Filter state ── */
  let activeStatus = '';
  let searchQ      = '';

  function getFiltered() {
    const allOrders = isAdmin
      ? OrderStore.getAll()
      : OrderStore.getByUser(user?.id);

    return allOrders.filter(o => {
      const matchStatus = !activeStatus || o.status === activeStatus;
      const matchQ      = !searchQ || String(o.id).toLowerCase().includes(searchQ);
      return matchStatus && matchQ;
    }).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  }

  function refresh() {
    const all      = isAdmin ? OrderStore.getAll() : OrderStore.getByUser(user?.id);
    const filtered = getFiltered();
    if (isAdmin) renderAdminStats(all);
    renderOrders(filtered);
  }

  /* ── Filter tabs ── */
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeStatus = btn.dataset.status;
      refresh();
    });
  });

  $('order-search').addEventListener('input', e => {
    searchQ = e.target.value.trim().toLowerCase();
    refresh();
  });

  /* ── Change status (admin) ── */
  window.changeStatus = function(orderId, newStatus) {
    if (!newStatus) return;
    OrderStore.updateStatus(orderId, newStatus);
    showToast(`Order #${orderId} status → ${newStatus}`, 'success');
    refresh();
  };

  /* ── View order detail modal ── */
  window.viewOrder = function(orderId) {
    const o      = OrderStore.getById(orderId);
    if (!o) return;
    const steps  = STATUS_FLOW;
    const curIdx = steps.indexOf(o.status);
    const timelineHtml = o.status === 'cancelled'
      ? '<span class="badge" style="background:#fee2e2;color:#dc2626;font-size:.8rem">Order Cancelled</span>'
      : `<div class="timeline">
          ${steps.map((s,i) => `
            <div class="timeline-step">
              <div class="timeline-dot ${i < curIdx ? 'done' : i === curIdx ? 'current' : 'pending'}"></div>
              <span style="color:${i <= curIdx ? '#1e293b':'#94a3b8'};font-weight:${i === curIdx ? '700':'400'}">${s.charAt(0).toUpperCase()+s.slice(1)}</span>
            </div>`).join('')}
         </div>`;

    const itemsHtml = (o.items || []).map(item => {
      const product = ProductStore?.getById(item.productId);
      return `
        <div class="order-item">
          <img src="${product?.image || 'https://placehold.co/48x48?text=P'}" alt="${product?.name || 'Product'}" onerror="this.src='https://placehold.co/48x48?text=P'" />
          <div class="order-item__info">
            <div class="order-item__name">${product?.name || item.productName || 'Product'}</div>
            <div class="order-item__qty">Qty: ${item.quantity}</div>
          </div>
          <div class="order-item__price">${formatINR((item.price || 0) * (item.quantity || 1))}</div>
        </div>`;
    }).join('');

    const shipping    = (o.subtotal || o.total || 0) >= 999 ? 0 : 99;
    const customerRow = isAdmin ? `
      <div class="info-row">
        <span>Customer</span>
        <span>${UserStore.getById(o.userId)?.name || 'Unknown'}</span>
      </div>` : '';

    $('order-modal-title').textContent = `Order #${o.id}`;
    $('order-modal-body').innerHTML = `
      <div>
        <div style="font-size:.75rem;color:#94a3b8;text-transform:uppercase;font-weight:600;margin-bottom:.5rem">Order Status</div>
        ${timelineHtml}
      </div>
      <hr class="divider" />
      <div>
        <div style="font-size:.75rem;color:#94a3b8;text-transform:uppercase;font-weight:600;margin-bottom:.75rem">Items</div>
        <div class="order-items-list">${itemsHtml || '<p style="color:#94a3b8">No items</p>'}</div>
      </div>
      <hr class="divider" />
      <div style="display:flex;flex-direction:column;gap:.5rem">
        ${customerRow}
        <div class="info-row"><span>Order ID</span><span class="order-id">#${o.id}</span></div>
        <div class="info-row"><span>Date</span><span>${formatDate(o.createdAt)}</span></div>
        <div class="info-row"><span>Payment</span><span>${o.paymentMethod || 'COD'}</span></div>
        <div class="info-row"><span>Delivery Address</span><span style="text-align:right;max-width:60%">${o.address ? `${o.address}, ${o.city || ''} ${o.state || ''} ${o.pin || ''}` : '–'}</span></div>
        <hr class="divider" />
        <div class="info-row"><span>Subtotal</span><span>${formatINR(o.subtotal || 0)}</span></div>
        <div class="info-row"><span>Shipping</span><span>${shipping === 0 ? '🎉 Free' : formatINR(shipping)}</span></div>
        <div class="info-row total-row" style="margin-top:.25rem"><span style="font-weight:700">Total</span><span style="color:#2563eb">${formatINR(o.total)}</span></div>
      </div>
    `;
    $('order-modal').classList.remove('hidden');
  };

  $('order-modal-close').addEventListener('click', () => $('order-modal').classList.add('hidden'));
  $('order-modal-ok').addEventListener('click',    () => $('order-modal').classList.add('hidden'));
  $('order-modal').addEventListener('click', e => { if (e.target === $('order-modal')) $('order-modal').classList.add('hidden'); });

  /* ── Init ── */
  if (isAdmin) {
    $('admin-stats').style.display = '';
    $('orders-subtitle').textContent = 'View and manage all customer orders';
  } else {
    $('orders-subtitle').textContent = 'Track your order history';
  }

  buildTableHead();
  refresh();
</script>
</body>
</html>
