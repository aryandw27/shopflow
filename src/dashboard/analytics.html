<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics & Spending Insights – ShopFlow</title>
  <link rel="stylesheet" href="../styles/main.scss" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
<div class="admin-app">
  <div class="admin-header" id="admin-header-placeholder"></div>
  <main class="admin-main">
    <div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1" id="analytics-title">
          <i class="bi bi-graph-up text-primary me-2"></i>Analytics & Performance
        </h1>
        <p class="text-muted mb-0" id="analytics-subtitle">
          Comprehensive breakdown of revenue, orders, inventory performance, and financial metrics.
        </p>
      </div>
      <div class="d-flex gap-2">
        <select class="form-select form-select-sm rounded-pill" id="time-filter">
          <option value="all">All Time</option>
          <option value="year">This Year</option>
          <option value="month" selected>Last 30 Days</option>
        </select>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="window.print()">
          <i class="bi bi-printer me-1"></i> Export Report
        </button>
      </div>
    </div>

    <!-- Summary KPI cards -->
    <div class="row g-4 mb-4" id="kpi-cards-row"></div>

    <!-- Main Charts Section -->
    <div class="row g-4 mb-4">
      <div class="col-lg-8">
        <div class="dash-card">
          <div class="card-header d-flex align-items-center justify-content-between">
            <h5 class="mb-0 fw-bold" id="primary-chart-title">Revenue Trajectory</h5>
            <span class="badge bg-primary-subtle text-primary">Monthly Trend</span>
          </div>
          <div class="card-body">
            <div id="chart-main" style="min-height: 320px;"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="dash-card h-100">
          <div class="card-header">
            <h5 class="mb-0 fw-bold" id="secondary-chart-title">Distribution Breakdown</h5>
          </div>
          <div class="card-body">
            <div id="chart-donut" style="min-height: 260px;"></div>
            <div id="donut-legend" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Secondary Charts Section -->
    <div class="row g-4 mb-4">
      <div class="col-lg-6">
        <div class="dash-card">
          <div class="card-header">
            <h5 class="mb-0 fw-bold" id="chart-3-title">Category Performance</h5>
          </div>
          <div class="card-body">
            <div id="chart-categories" style="min-height: 280px;"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="dash-card">
          <div class="card-header">
            <h5 class="mb-0 fw-bold" id="chart-4-title">Top Items & Demand</h5>
          </div>
          <div class="card-body">
            <div id="chart-items" style="min-height: 280px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Detail Table -->
    <div class="dash-card" id="detail-table-card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold" id="table-title">Performance Log</h5>
        <span class="text-muted small" id="table-count"></span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="dash-table" id="analytics-table">
            <thead id="analytics-thead"></thead>
            <tbody id="analytics-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { initDashboardShell, formatINR, formatDate, getStatusColor, getStatusBg } from '../scripts/dashboard-shell.js';
  import { AuthStore, ProductStore, OrderStore, UserStore } from '../scripts/store.js';

  const user = initDashboardShell({ activePage: 'analytics', pageTitle: 'Analytics' });
  if (!user) throw new Error('Not authenticated');

  const isAdmin = user.role === 'admin';

  // Customize headers for user vs admin
  if (!isAdmin) {
    document.getElementById('analytics-title').innerHTML = '<i class="bi bi-wallet2 text-primary me-2"></i>My Spending Analytics';
    document.getElementById('analytics-subtitle').textContent = 'Detailed breakdown of your shopping expenses, favorite categories, and order history.';
    document.getElementById('primary-chart-title').textContent = 'My Monthly Spending';
    document.getElementById('secondary-chart-title').textContent = 'Orders by Status';
    document.getElementById('chart-3-title').textContent = 'My Top Categories';
    document.getElementById('chart-4-title').textContent = 'Order Size Breakdown';
    document.getElementById('table-title').textContent = 'My Purchase History';
  }

  function renderDashboard() {
    if (isAdmin) {
      renderAdminAnalytics();
    } else {
      renderUserSpending();
    }
  }

  // ─────────────────────────────────────────────────────────────
  // ADMIN ANALYTICS
  // ─────────────────────────────────────────────────────────────
  function renderAdminAnalytics() {
    const orders = OrderStore.getAll();
    const products = ProductStore.getAll();
    const users = UserStore.getAll();

    const totalRevenue = orders.reduce((sum, o) => sum + (o.status !== 'cancelled' ? o.total : 0), 0);
    const completedOrders = orders.filter(o => o.status === 'delivered').length;
    const avgOrderVal = orders.length > 0 ? Math.round(totalRevenue / orders.length) : 0;
    const inventoryVal = products.reduce((sum, p) => sum + (p.price * p.stock), 0);

    // KPI Cards
    document.getElementById('kpi-cards-row').innerHTML = `
      <div class="col-sm-6 col-xl-3">
        <div class="dash-card stat-card">
          <div class="stat-icon" style="background: rgba(79,110,247,0.1); color: #4f6ef7;">
            <i class="bi bi-cash-stack"></i>
          </div>
          <div>
            <div class="stat-label">Net Sales Revenue</div>
            <div class="stat-value">${formatINR(totalRevenue)}</div>
            <div class="stat-change up"><i class="bi bi-arrow-up"></i> +14.2% vs last month</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="dash-card stat-card">
          <div class="stat-icon" style="background: rgba(34,197,94,0.1); color: #22c55e;">
            <i class="bi bi-receipt"></i>
          </div>
          <div>
            <div class="stat-label">Average Order Value</div>
            <div class="stat-value">${formatINR(avgOrderVal)}</div>
            <div class="stat-change up"><i class="bi bi-arrow-up"></i> +5.8% avg ticket</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="dash-card stat-card">
          <div class="stat-icon" style="background: rgba(245,158,11,0.1); color: #f59e0b;">
            <i class="bi bi-boxes"></i>
          </div>
          <div>
            <div class="stat-label">Inventory Valuation</div>
            <div class="stat-value">${formatINR(inventoryVal)}</div>
            <div class="stat-change text-muted">${products.length} catalog items</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="dash-card stat-card">
          <div class="stat-icon" style="background: rgba(6,182,212,0.1); color: #06b6d4;">
            <i class="bi bi-people"></i>
          </div>
          <div>
            <div class="stat-label">Customer Base</div>
            <div class="stat-value">${users.filter(u=>u.role==='user').length} shoppers</div>
            <div class="stat-change up"><i class="bi bi-arrow-up"></i> +22% signup rate</div>
          </div>
        </div>
      </div>
    `;

    // 1. Revenue Trajectory (Area Chart)
    const months = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
    const monthlyData = [34000, 48000, 52000, 46000, 61000, 58000, 72000, 84000, 79000, 92000, 110000, 124850];

    new ApexCharts(document.getElementById('chart-main'), {
      chart: { type: 'area', height: 320, toolbar: { show: false }, fontFamily: 'Inter Variable, sans-serif' },
      series: [{ name: 'Revenue', data: monthlyData }],
      xaxis: { categories: months },
      colors: ['#4f6ef7'],
      stroke: { curve: 'smooth', width: 3 },
      fill: { type: 'gradient', gradient: { opacityFrom: 0.45, opacityTo: 0.05 } },
      yaxis: { labels: { formatter: v => '₹' + (v/1000).toFixed(0) + 'K' } },
      tooltip: { y: { formatter: v => formatINR(v) } }
    }).render();

    // 2. Order Status (Donut)
    const statusCounts = {
      delivered: orders.filter(o=>o.status==='delivered').length,
      processing: orders.filter(o=>o.status==='processing').length,
      confirmed: orders.filter(o=>o.status==='confirmed').length,
      cancelled: orders.filter(o=>o.status==='cancelled').length,
    };

    new ApexCharts(document.getElementById('chart-donut'), {
      chart: { type: 'donut', height: 260, fontFamily: 'Inter Variable, sans-serif' },
      series: Object.values(statusCounts),
      labels: ['Delivered', 'Processing', 'Confirmed', 'Cancelled'],
      colors: ['#22c55e', '#f59e0b', '#4f6ef7', '#ef4444'],
      legend: { position: 'bottom' },
      dataLabels: { enabled: false },
      plotOptions: { pie: { donut: { size: '70%' } } }
    }).render();

    // 3. Category breakdown (Bar)
    const categories = ProductStore.getCategories();
    const catCounts = categories.map(c => products.filter(p => p.category === c).length);

    new ApexCharts(document.getElementById('chart-categories'), {
      chart: { type: 'bar', height: 280, toolbar: { show: false }, fontFamily: 'Inter Variable, sans-serif' },
      series: [{ name: 'Products in Catalog', data: catCounts }],
      xaxis: { categories: categories },
      colors: ['#4f6ef7'],
      plotOptions: { bar: { borderRadius: 6, horizontal: false, columnWidth: '45%' } },
      dataLabels: { enabled: false }
    }).render();

    // 4. Top Selling Products (Horizontal Bar)
    const topProducts = products.slice(0, 5);
    new ApexCharts(document.getElementById('chart-items'), {
      chart: { type: 'bar', height: 280, toolbar: { show: false }, fontFamily: 'Inter Variable, sans-serif' },
      series: [{ name: 'Price (₹)', data: topProducts.map(p=>p.price) }],
      xaxis: { categories: topProducts.map(p=>p.name.length > 20 ? p.name.substring(0, 18) + '...' : p.name) },
      colors: ['#22c55e'],
      plotOptions: { bar: { borderRadius: 6, horizontal: true } },
      dataLabels: { enabled: false }
    }).render();

    // Table: Latest Orders
    document.getElementById('analytics-thead').innerHTML = `
      <tr>
        <th>Order ID</th><th>Customer</th><th>Items</th><th>Amount</th><th>Status</th><th>Date</th>
      </tr>
    `;
    document.getElementById('table-count').textContent = `${orders.length} Total Orders`;

    document.getElementById('analytics-tbody').innerHTML = orders.slice().reverse().map(o => {
      const u = users.find(u => u.id === o.userId);
      return `
        <tr>
          <td class="fw-bold">${o.id}</td>
          <td>${u ? u.name : 'Customer'}</td>
          <td>${o.items ? o.items.length : 0} items</td>
          <td class="fw-bold text-primary">${formatINR(o.total)}</td>
          <td><span class="status-badge" style="background:${getStatusBg(o.status)}; color:${getStatusColor(o.status)}">${o.status}</span></td>
          <td class="text-muted small">${formatDate(o.createdAt)}</td>
        </tr>
      `;
    }).join('');
  }

  // ─────────────────────────────────────────────────────────────
  // USER SPENDING ANALYTICS
  // ─────────────────────────────────────────────────────────────
  function renderUserSpending() {
    const orders = OrderStore.getUserOrders(user.id);
    const totalSpent = orders.reduce((sum, o) => sum + (o.status !== 'cancelled' ? o.total : 0), 0);
    const avgOrder = orders.length > 0 ? Math.round(totalSpent / orders.length) : 0;
    const deliveredCount = orders.filter(o => o.status === 'delivered').length;

    // KPI Cards
    document.getElementById('kpi-cards-row').innerHTML = `
      <div class="col-sm-6 col-xl-3">
        <div class="dash-card stat-card">
          <div class="stat-icon" style="background: rgba(79,110,247,0.1); color: #4f6ef7;">
            <i class="bi bi-wallet-fill"></i>
          </div>
          <div>
            <div class="stat-label">Total Amount Spent</div>
            <div class="stat-value">${formatINR(totalSpent)}</div>
            <div class="stat-change text-muted">Across all orders</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="dash-card stat-card">
          <div class="stat-icon" style="background: rgba(34,197,94,0.1); color: #22c55e;">
            <i class="bi bi-bag-check-fill"></i>
          </div>
          <div>
            <div class="stat-label">Orders Placed</div>
            <div class="stat-value">${orders.length}</div>
            <div class="stat-change up">${deliveredCount} delivered</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="dash-card stat-card">
          <div class="stat-icon" style="background: rgba(245,158,11,0.1); color: #f59e0b;">
            <i class="bi bi-tag-fill"></i>
          </div>
          <div>
            <div class="stat-label">Average Order Size</div>
            <div class="stat-value">${formatINR(avgOrder)}</div>
            <div class="stat-change text-muted">Per transaction</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="dash-card stat-card">
          <div class="stat-icon" style="background: rgba(168,85,247,0.1); color: #a855f7;">
            <i class="bi bi-shield-check"></i>
          </div>
          <div>
            <div class="stat-label">Member Status</div>
            <div class="stat-value" style="font-size: 1.4rem;">Verified User</div>
            <div class="stat-change up">Active Shopper</div>
          </div>
        </div>
      </div>
    `;

    // Monthly spending bar
    const months = ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
    const dummyVals = [0, 0, 0, 2999, 10997, totalSpent > 13996 ? totalSpent : 13996];

    new ApexCharts(document.getElementById('chart-main'), {
      chart: { type: 'bar', height: 320, toolbar: { show: false }, fontFamily: 'Inter Variable, sans-serif' },
      series: [{ name: 'Spending (₹)', data: dummyVals }],
      xaxis: { categories: months },
      colors: ['#4f6ef7'],
      plotOptions: { bar: { borderRadius: 8, columnWidth: '40%' } },
      yaxis: { labels: { formatter: v => '₹' + v.toLocaleString('en-IN') } },
      tooltip: { y: { formatter: v => formatINR(v) } }
    }).render();

    // Order status breakdown
    const sDelivered = orders.filter(o=>o.status==='delivered').length;
    const sProcessing = orders.filter(o=>o.status==='processing').length;
    const sConfirmed = orders.filter(o=>o.status==='confirmed').length;

    new ApexCharts(document.getElementById('chart-donut'), {
      chart: { type: 'donut', height: 260, fontFamily: 'Inter Variable, sans-serif' },
      series: [sDelivered || 1, sProcessing || 1, sConfirmed || 1],
      labels: ['Delivered', 'Processing', 'Confirmed'],
      colors: ['#22c55e', '#f59e0b', '#4f6ef7'],
      legend: { position: 'bottom' },
      plotOptions: { pie: { donut: { size: '70%' } } }
    }).render();

    // Categories
    new ApexCharts(document.getElementById('chart-categories'), {
      chart: { type: 'pie', height: 280, fontFamily: 'Inter Variable, sans-serif' },
      series: [45, 25, 20, 10],
      labels: ['Electronics', 'Fitness', 'Home', 'Others'],
      colors: ['#4f6ef7', '#22c55e', '#f59e0b', '#06b6d4'],
      legend: { position: 'bottom' }
    }).render();

    // Order Size distribution
    new ApexCharts(document.getElementById('chart-items'), {
      chart: { type: 'bar', height: 280, toolbar: { show: false }, fontFamily: 'Inter Variable, sans-serif' },
      series: [{ name: 'Orders in bracket', data: [1, 2, 1] }],
      xaxis: { categories: ['Under ₹1,000', '₹1,000 - ₹5,000', 'Over ₹5,000'] },
      colors: ['#06b6d4'],
      plotOptions: { bar: { borderRadius: 6, columnWidth: '40%' } }
    }).render();

    // Table: User Purchases
    document.getElementById('analytics-thead').innerHTML = `
      <tr>
        <th>Order ID</th><th>Items Ordered</th><th>Amount Paid</th><th>Status</th><th>Date</th>
      </tr>
    `;
    document.getElementById('table-count').textContent = `${orders.length} Orders`;

    if (orders.length === 0) {
      document.getElementById('analytics-tbody').innerHTML = `
        <tr><td colspan="5" class="text-center py-4 text-muted">No orders placed yet. <a href="../store.html" class="fw-bold">Browse products to shop!</a></td></tr>
      `;
    } else {
      document.getElementById('analytics-tbody').innerHTML = orders.slice().reverse().map(o => `
        <tr>
          <td class="fw-bold">${o.id}</td>
          <td>${o.items ? o.items.map(i=>i.name).join(', ') : 'Items'}</td>
          <td class="fw-bold text-primary">${formatINR(o.total)}</td>
          <td><span class="status-badge" style="background:${getStatusBg(o.status)}; color:${getStatusColor(o.status)}">${o.status}</span></td>
          <td class="text-muted small">${formatDate(o.createdAt)}</td>
        </tr>
      `).join('');
    }
  }

  renderDashboard();
</script>
</body>
</html>
